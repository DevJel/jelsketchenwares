@keyframes fadeUp{

  }

    opacity:1;
    transform:none
  }

  from{

  }

  to{
    opacity:1;
    transform:none
  }

  }

  100%{

  }
}

  }

    transform:none
  }

  to{
    transform:none
  }
}

  from{

    transform:translateY(18px) scale(.97)
  }

  to{
    opacity:1;
    transform:none
  }

  }
